  <h1>Customer Dashboard</h1>
  <hr>

  <div class="dash-container">
    <!-- Profile card: UPDATE customer info -->
    <div class="dash-card">
      <h2><i class="fas fa-id-card"></i> My Profile</h2>
      <form id="profile-form" novalidate>
        <div class="form-group">
          <label for="pf-name">Full Name</label>
          <input type="text" id="pf-name">
          <small class="field-error" data-for="pf-name"></small>
        </div>
        <div class="form-group">
          <label for="pf-email">Email</label>
          <input type="email" id="pf-email">
          <small class="field-error" data-for="pf-email"></small>
        </div>
        <div class="form-group">
          <label for="pf-phone">Phone</label>
          <input type="text" id="pf-phone" placeholder="+63 917 123 4567">
          <small class="field-error" data-for="pf-phone"></small>
        </div>
        <button type="submit" class="btn btn-primary">Save Changes</button>
      </form>
    </div>

    <!-- Orders table: READ / DELETE own orders -->
    <div class="dash-card dash-wide">
      <h2><i class="fas fa-box-open"></i> My Orders</h2>
      <table class="table orders-table">
        <thead>
          <tr><th>#</th><th>Date</th><th>Items</th><th>Total</th><th>Status</th><th>Action</th></tr>
        </thead>
        <tbody id="orders-body">
          <tr><td colspan="6" class="text-center">Loading…</td></tr>
        </tbody>
      </table>
      <p id="no-orders" style="display:none;">You have no orders yet. <a href="catalog.html">Start shopping →</a></p>
    </div>
  </div>
